name: 하루봇 daily run

on:
  # Vercel Cron → api/webhook.py의 do_GET → 이 workflow_dispatch.
  # 21시대 정규, 실패 시 22시대·23시대 재시도 (전부 자정 전). 스케줄은 vercel.json.
  #
  # GitHub schedule 트리거는 의도적으로 쓰지 않는다 — 큐 지연이 중앙값 5h50m,
  # 최대 10h07m까지 벌어져서 새벽에 알림이 도착했다. 늦게 배달되는 것보다
  # 그날 못 보내는 쪽이 낫다는 판단.
  workflow_dispatch: # Vercel Cron + 수동 실행

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run haru-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DIARY_DB_ID: ${{ secrets.NOTION_DIARY_DB_ID }}
          # Actions 자동 토큰 — public repo 커밋 검색용 (별도 발급 불필요)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python src/main.py

      - name: Commit usage log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usage_log.csv
          # Vercel 재배포는 vercel.json의 ignoreCommand로 막는다 ([skip ci]는 Vercel에서 무시됨)
          git diff --cached --quiet || git commit -m "diary: $(date +%Y-%m-%d) 사용량 기록 [skip ci]"
          git push
