name: 하루봇 daily todo 생성 + 아침 알림

on:
  # 주 트리거는 Vercel Cron → api/cron.py → 이 workflow_dispatch (06:00~06:59 KST).
  # schedule은 백업 (단독 지연 중앙값 2h00m). 중복은 src/daily_todo.py가 그날 TODO
  # 페이지 존재 여부로 건너뛴다.
  schedule:
    - cron: '0 21 * * *' # 06:00 KST (전날 21:00 UTC)
  workflow_dispatch: # Vercel Cron + 수동 실행

jobs:
  create-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Create daily TODO page and notify
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ROOT_PAGE_ID: ${{ secrets.ROOT_PAGE_ID }}
          TEMPLATE_PAGE_ID: ${{ secrets.TEMPLATE_PAGE_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python src/daily_todo.py
