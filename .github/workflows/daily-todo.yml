name: 하루봇 daily todo 생성 + 아침 알림

on:
  # Vercel Cron → api/webhook.py의 do_GET → 이 workflow_dispatch.
  # 6시대 정규, 실패 시 7시대 재시도. 스케줄은 vercel.json.
  # GitHub schedule 트리거는 쓰지 않는다 (daily.yml 주석 참조).
  workflow_dispatch: # Vercel Cron + 수동 실행

jobs:
  create-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Create daily TODO page and notify
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ROOT_PAGE_ID: ${{ secrets.ROOT_PAGE_ID }}
          TEMPLATE_PAGE_ID: ${{ secrets.TEMPLATE_PAGE_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python src/daily_todo.py
